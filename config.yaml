data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"                            # never a feature; used only for the fairness report
  drop_columns: ["id", "decile_score", "score_text"]  # kept in the data, never used as features

# Locked test set: never used to fit, tune or choose anything. Do not change once set.
test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"
  n_jobs: 1                                         # -1 = all CPU cores

diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # "nan" catches real NaNs turned into text by the category cleanup.
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

preprocessing:
  encoder: "target"                                 # onehot | ordinal | count | target
  scaler: "robust"                                  # none | standard | minmax | robust
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]   # get a <col>_was_missing flag
  random_state: 42                                  # target encoder's internal folds
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"


model:
  type: "random_forest"  # dummy | logistic_regression | decision_tree | random_forest | oblique_random_forest | adaboost
  params:
    random_state: 42

    # Default parameters for the currently selected Random Forest.
    n_estimators: 200
    n_jobs: -1

tuning:
  enabled: true
  n_trials: 2             # Use 2 for testing; increase to 30 for full runs
  n_splits: 5
  random_state: 42





  search_spaces:

    # --------------------------------------------------
    # Logistic Regression
    # --------------------------------------------------
    logistic_regression:
      model__C:
        type: float
        low: 0.0001
        high: 100
        log: true

      model__class_weight:
        type: categorical
        choices: [null, "balanced"]

    # --------------------------------------------------
    # Decision Tree
    # --------------------------------------------------
    decision_tree:
      model__max_depth:
        type: categorical
        choices: [null, 3, 5, 8, 12, 16, 20]

      model__min_samples_leaf:
        type: int
        low: 1
        high: 100
        log: true

      model__min_samples_split:
        type: int
        low: 2
        high: 50

      model__criterion:
        type: categorical
        choices: ["gini", "entropy"]

      model__class_weight:
        type: categorical
        choices: [null, "balanced"]

    # --------------------------------------------------
    # Random Forest
    # --------------------------------------------------
    random_forest:
      model__n_estimators:
        type: int
        low: 100
        high: 400

      model__max_depth:
        type: categorical
        choices: [null, 5, 8, 12, 16, 20]

      model__min_samples_leaf:
        type: int
        low: 1
        high: 50
        log: true

      model__max_features:
        type: categorical
        choices: ["sqrt", "log2", 1.0]

      model__criterion:
        type: categorical
        choices: ["gini", "entropy"]

      model__class_weight:
        type: categorical
        choices: [null, "balanced"]

    # --------------------------------------------------
    # Oblique Random Forest
    # --------------------------------------------------
    oblique_random_forest:
      model__n_estimators:
        type: int
        low: 100
        high: 400

      model__estimator__project__n_components:
        type: int
        low: 2
        high: 20

      model__estimator__tree__max_depth:
        type: categorical
        choices: [null, 5, 8, 12, 16, 20]

      model__estimator__tree__min_samples_leaf:
        type: int
        low: 1
        high: 50
        log: true


    # --------------------------------------------------
    # AdaBoost
    # --------------------------------------------------
    adaboost:
      model__estimator__max_depth:
        type: int
        low: 1
        high: 10

      model__n_estimators:
        type: int
        low: 50
        high: 300

      model__learning_rate:
        type: float
        low: 0.01
        high: 2.0
        log: true


output:
  results_dir: "results"